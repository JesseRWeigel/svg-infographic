<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 172.4" width="720" height="172.4" role="img" aria-label="A string longer than the whole canvas" data-engine="svg-infographic" data-spec-id="c06-longer-than-canvas" data-theme="light" data-font="DejaVu Sans" id="ig-c06-longer-than-canvas">
  <title>A string longer than the whole canvas</title>
  <rect class="ig-bg" x="0" y="0" width="720" height="172.4" fill="var(--ig-bg, #ffffff)"/>
  <rect id="box-box_header" class="ig-box ig-box-frame" x="22" y="22" width="676" height="32.39" data-role="frame" data-pad-x="0" data-pad-y="0" data-content="22 22 676 32.39" fill="none" stroke="none"/>
  <rect id="box-box_p0" class="ig-box ig-box-frame" x="22" y="72.39" width="676" height="78.01" data-role="frame" data-pad-x="0" data-pad-y="0" data-content="22 72.39 676 78.01" fill="none" stroke="none"/>
  <text id="t1" class="ig-text ig-role-title" x="22" y="47.14" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_header" data-role="title" data-measured="559.49" data-ascent="25.14" data-descent="7.25" data-fit="22 698" data-ink="0 0">A string longer than the whole canvas</text>
  <text id="t2" class="ig-text ig-role-para" x="22" y="86.39" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="615.07" data-ascent="14" data-descent="4.37" data-fit="22 698" data-ink="0.05 0">This single sentence is deliberately far longer than the canvas it has to fit inside, so the</text>
  <text id="t3" class="ig-text ig-role-para" x="22" y="106.27" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="615.9" data-ascent="14" data-descent="4.37" data-fit="22 698" data-ink="0 0">wrapper has to break it across many lines and every one of those lines has to come out</text>
  <text id="t4" class="ig-text ig-role-para" x="22" y="126.15" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="649.64" data-ascent="14" data-descent="4.37" data-fit="22 698" data-ink="0 0">narrower than the container the constraint solver assigned to it, otherwise claim one is false</text>
  <text id="t5" class="ig-text ig-role-para" x="22" y="146.03" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="210.27" data-ascent="14" data-descent="4.37" data-fit="22 698" data-ink="0 0">and the overflow test says so.</text>
</svg>
