  <text id="t1" class="ig-text ig-role-title" x="22" y="50.12" font-family="Droid Sans Fallback" font-size="26" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_header" data-role="title" data-measured="234" data-ascent="28.12" data-descent="7.91" data-fit="22 698" data-ink="0 0">中文与日本語の組版</text>
  <text id="t2" class="ig-text ig-role-subtitle" x="22" y="79.64" font-family="Droid Sans Fallback" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-muted, #5b6472)" data-box="box_subtitle" data-role="subtitle" data-measured="196" data-ascent="15.61" data-descent="4.72" data-fit="22 698" data-ink="0 0">スペースなし、文字単位で改行</text>
  <text id="t3" class="ig-text ig-role-para" x="22" y="117.97" font-family="Droid Sans Fallback" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="420" data-ascent="15.61" data-descent="4.72" data-fit="22 698" data-ink="0 0">中文排版没有空格所以必须逐字断行，这一行会被引擎按字符切开。</text>
  <text id="t4" class="ig-text ig-role-para" x="36" y="170.3" font-family="Droid Sans Fallback" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p1" data-role="para" data-measured="420" data-ascent="15.61" data-descent="4.72" data-fit="36 684" data-ink="0 0">日本語のテキストもスペースがないため、文字単位で改行します。</text>
  <text id="t5" class="ig-text ig-role-kpivalue" x="34" y="247.14" font-family="Droid Sans Fallback" font-size="26" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_k2c0" data-role="kpivalue" data-measured="52" data-ascent="28.12" data-descent="7.91" data-fit="34 342" data-ink="0 0">十倍</text>
