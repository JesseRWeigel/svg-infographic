<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236.77" width="720" height="236.77" role="img" aria-label="Emphasised paragraph in a panel" data-engine="svg-infographic" data-spec-id="c27-para-emphasis" data-theme="light" data-font="DejaVu Sans" id="ig-c27-para-emphasis">
  <title>Emphasised paragraph in a panel</title>
  <rect class="ig-bg" x="0" y="0" width="720" height="236.77" fill="var(--ig-bg, #ffffff)"/>
  <rect id="box-box_header" class="ig-box ig-box-frame" x="22" y="22" width="676" height="32.39" data-role="frame" data-pad-x="0" data-pad-y="0" data-content="22 22 676 32.39" fill="none" stroke="none"/>
  <rect id="box-box_p0" class="ig-box ig-box-panel" x="22" y="72.39" width="676" height="106.01" data-role="panel" data-pad-x="14" data-pad-y="14" data-content="36 86.39 648 78.01" rx="10" fill="var(--ig-panel, #f4f6f9)" stroke="var(--ig-panel-line, #e0e5ec)"/>
  <rect id="box-box_p1" class="ig-box ig-box-frame" x="22" y="196.4" width="676" height="18.37" data-role="frame" data-pad-x="0" data-pad-y="0" data-content="22 196.4 676 18.37" fill="none" stroke="none"/>
  <text id="t1" class="ig-text ig-role-title" x="22" y="47.14" font-family="DejaVu Sans" font-size="26" font-weight="700" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_header" data-role="title" data-measured="490.64" data-ascent="25.14" data-descent="7.25" data-fit="22 698" data-ink="0 0">Emphasised paragraph in a panel</text>
  <text id="t2" class="ig-text ig-role-para" x="36" y="100.39" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="644.23" data-ascent="14" data-descent="4.37" data-fit="36 684" data-ink="0 0">This single sentence is deliberately far longer than the canvas it has to fit inside,</text>
  <text id="t3" class="ig-text ig-role-para" x="36" y="120.27" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="647.62" data-ascent="14" data-descent="4.37" data-fit="36 684" data-ink="0 0">so the wrapper has to break it across many lines and every one of those lines has</text>
  <text id="t4" class="ig-text ig-role-para" x="36" y="140.15" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="611.36" data-ascent="14" data-descent="4.37" data-fit="36 684" data-ink="0 0">to come out narrower than the container the constraint solver assigned to it,</text>
  <text id="t5" class="ig-text ig-role-para" x="36" y="160.03" font-family="DejaVu Sans" font-size="14" font-weight="700" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="463.19" data-ascent="14" data-descent="4.37" data-fit="36 684" data-ink="0 0">otherwise claim one is false and the overflow test says so.</text>
  <text id="t6" class="ig-text ig-role-para" x="22" y="210.4" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p1" data-role="para" data-measured="106.68" data-ascent="14" data-descent="4.37" data-fit="22 698" data-ink="0 0">Plain follow-up.</text>
</svg>
