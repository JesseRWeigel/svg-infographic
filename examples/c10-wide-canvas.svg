  <text id="t2" class="ig-text ig-role-para" x="22" y="86.39" font-family="DejaVu Sans" font-size="14" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="1540.07" data-ascent="14" data-descent="4.37" data-fit="22 1578" data-ink="0.05 0">This single sentence is deliberately far longer than the canvas it has to fit inside, so the wrapper has to break it across many lines and every one of those lines has to come out narrower than the container the constraint</text>
