  <text id="t2" class="ig-text ig-role-para" x="22" y="77.11" font-family="DejaVu Sans" font-size="4" font-weight="400" text-anchor="start" style="text-rendering:geometricPrecision;font-kerning:none;font-variant-ligatures:none;letter-spacing:0" xml:space="preserve" fill="var(--ig-fg, #14161a)" data-box="box_p0" data-role="para" data-measured="601.21" data-ascent="4.72" data-descent="1.97" data-fit="22 698" data-ink="0.02 0">This single sentence is deliberately far longer than the canvas it has to fit inside, so the wrapper has to break it across many lines and every one of those lines has to come out narrower than the container the constraint solver assigned to it, otherwise claim one is false and the overflow test says so.</text>
